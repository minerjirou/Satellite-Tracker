name: CelesTrak 到達性プローブ (一時)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Actions の egress から CelesTrak を叩く
        run: |
          UA="satellite-tracker/0.1 (+https://github.com/Minerjirou/Satellite-Tracker)"
          for fmt in json csv; do
            echo "--- FORMAT=$fmt ---"
            curl -sS --compressed --max-time 90 \
              -o /tmp/out.$fmt \
              -w "HTTP %{http_code}  接続 %{time_connect}s  初バイト %{time_starttransfer}s  完了 %{time_total}s  転送 %{size_download} bytes\n" \
              "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=$fmt" \
              -H "user-agent: $UA" || echo "curl failed"
            echo "展開後: $(wc -c < /tmp/out.$fmt) bytes"
            head -c 100 /tmp/out.$fmt; echo
            sleep 3
          done
